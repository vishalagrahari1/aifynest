<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- SEO & Indexing Directives -->
    <title>AIFynest — Discover & Compare the Best AI Tools</title>
    <meta name="description" content="AIFynest is the premier AI software tools directory. Discover, compare, save, and review 196+ curated artificial intelligence tools for writing, image generation, coding, and productivity." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://aifynest.com" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AIFynest Directory" />
    <meta property="og:title" content="AIFynest — Discover & Compare the Best AI Tools" />
    <meta property="og:description" content="AIFynest is the premier AI software tools directory. Discover, compare, save, and review 196+ curated artificial intelligence tools." />
    <meta property="og:url" content="https://aifynest.com" />
    <meta property="og:image" content="https://aifynest.com/logo.png" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AIFynest — Discover & Compare the Best AI Tools" />
    <meta name="twitter:description" content="Discover, compare, save, and review 196+ curated artificial intelligence software tools on AIFynest." />
    <meta name="twitter:image" content="https://aifynest.com/logo.png" />

    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- WebSite Structured Schema (Google Sitelinks Searchbox) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AIFynest",
      "alternateName": ["AIFynest Directory", "AIFynest AI Directory"],
      "url": "https://aifynest.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://aifynest.com/ai-tools?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
